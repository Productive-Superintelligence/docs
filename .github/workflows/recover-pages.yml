name: Refresh Branch Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pages: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh branch-backed Pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "pages-refresh",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method, path, payload=None):
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{path}",
                  data=data,
                  headers=headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read().decode()
                      return response.status, json.loads(body) if body else None
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode()
                  print(method, path, exc.code, body)
                  return exc.code, json.loads(body) if body else None

          status, deployments = request("GET", "/deployments?per_page=10")
          if status == 200:
              for deployment in deployments:
                  if deployment.get("environment") != "github-pages":
                      continue
                  _, statuses = request("GET", f"/deployments/{deployment['id']}/statuses")
                  latest = statuses[0]["state"] if statuses else None
                  if latest == "in_progress":
                      request(
                          "POST",
                          f"/deployments/{deployment['id']}/statuses",
                          {
                              "state": "error",
                              "description": "Superseded by branch-backed /docs Pages output.",
                              "environment": "github-pages",
                          },
                      )

          request("POST", "/pages/builds")
          PY
